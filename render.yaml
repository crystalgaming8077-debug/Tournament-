services:
  - type: web
    name: aktan-tournament-public
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: aktan-public-db
          property: connectionString

databases:
  - name: aktan-public-db
    plan: free
